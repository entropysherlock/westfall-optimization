services:
  - type: web
    name: adaptivepair-atlas075
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn api:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADAPTIVEPAIR_ALLOWED_ORIGINS
        value: https://entropysherlock.github.io
