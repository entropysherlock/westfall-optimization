name: Lean Foundations
on:
  push:
    branches: [main]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build: true
          axiom-audit: true
          axiom-audit-root: Westfall022
