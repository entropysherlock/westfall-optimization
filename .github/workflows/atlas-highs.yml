name: ATLAS-H native HiGHS experiment
on:
  push:
    branches: [engineering/atlas-highs-native-experiment]
  pull_request:
    paths:
      - "src/westfall_optimization/solvers/highs_native.py"
      - "src/westfall_optimization/blx/portfolio.py"
      - "src/westfall_optimization/cli.py"
      - "tests/test_highs_native.py"
      - "pyproject.toml"
      - ".github/workflows/atlas-highs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  highspy-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native HiGHS dependency and tests
        run: python -m pip install -e ".[test,highs]"
      - name: Confirm native solver version
        run: python -c "import highspy; h=highspy.Highs(); print('HiGHS',h.version())"
      - name: Independent small exhaustive correctness tests
        run: python -m pytest -q tests/test_highs_native.py
