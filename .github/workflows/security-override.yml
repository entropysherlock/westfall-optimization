name: Security override experiment
on:
  push:
    branches: ["security/postcss-override"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-save-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve a lockfile for pinned override
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:links
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Audit dependency graph
        run: npm audit --json > npm-audit-after.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-postcss-override
          path: website/npm-audit-after.json
      - name: Commit validated lockfile to experiment branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate lockfile for audited PostCSS override"
            git push origin HEAD:security/postcss-override
          fi
