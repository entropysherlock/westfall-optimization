name: Mission 042 reproducibility
on:
  push:
    branches: [research/westfall-042-independent-audit]
    paths:
      - "research/westfall-041/lean/**"
      - "research/westfall-042/**"
      - ".github/workflows/research-042.yml"
  pull_request:
    paths:
      - "research/westfall-041/lean/**"
      - "research/westfall-042/**"
      - ".github/workflows/research-042.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python research/westfall-042/tests/test_bound042.py
  lean-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib
        working-directory: research/westfall-041/lean
        run: lake update
      - name: Fetch Mathlib cache
        working-directory: research/westfall-041/lean
        run: lake exe cache get
      - name: Build Mission 042 coordinate lemmas
        working-directory: research/westfall-041/lean
        run: lake build Westfall042
      - name: Print axioms of compiled coordinate lemmas
        working-directory: research/westfall-041/lean
        run: lake env lean Audit042.lean
