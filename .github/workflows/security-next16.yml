name: Next 16 security-upgrade experiment
on:
  push:
    branches: ["security/next16-upgrade"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Next.js and its ESLint configuration
        run: |
          npm install --save-exact next@16.4.6 eslint-config-next@16.4.6
          npm pkg set scripts.lint="eslint ."
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:links
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Audit resulting dependency graph
        run: npm audit --json > npm-audit-after.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit-next16-experiment
          path: website/npm-audit-after.json
      - name: Save validated upgrade to this branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package.json website/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Next.js 16 and audit compatible website"
            git push origin HEAD:security/next16-upgrade
          fi
