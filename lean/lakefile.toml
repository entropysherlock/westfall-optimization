name = "Westfall022"
version = "0.1.0"
defaultTargets = ["Westfall022"]

[[lean_lib]]
name = "Westfall022"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Tests"
srcDir = "."
roots = ["tests.ExecHarness", "tests.ExecHarness2", "tests.ExecHarness3", "tests.MemoHarness", "tests.UnmemoHarness"]

[[lean_exe]]
name = "westfall-exec-tests"
root = "tests.ExecHarness"

[[lean_exe]]
name = "westfall-exec-tests-manuscript"
root = "tests.ExecHarness2"

[[lean_exe]]
name = "westfall-exec-tests-small"
root = "tests.ExecHarness3"

[[lean_exe]]
name = "westfall-memo-bench"
root = "tests.MemoHarness"

[[lean_exe]]
name = "westfall-unmemo-bench"
root = "tests.UnmemoHarness"
