[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westfall-service"
version = "1.0.0"
description = "Job API for Westfall Optimization Studio (wraps the westfall-optimization solvers)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "westfall-optimization"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["westfall_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
